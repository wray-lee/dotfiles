# niri idle/lock daemon config (hypridle works on niri via ext-idle-notify-v1).
# Adapted copy of ~/.config/hypr/hypridle.conf: DPMS goes through `niri msg`,
# and the locker is scripts/lock.sh (the single owner of the hyprlock config).
# Same policy as Hyprland: warn at 9 min, lock at 10 min. No screen-off and no
# auto-suspend listener (both were commented out in the Hyprland file too).
general {
    lock_cmd = $HOME/.config/niri/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors
    inhibit_sleep = 3
    ignore_dbus_inhibit = false
}

# Warn (9 min)
listener {
    timeout = 540
    on-timeout = notify-send -a niri -i "$HOME/.config/swaync/images/ja.png" "You are idle!"
    on-resume = notify-send -a niri -i "$HOME/.config/swaync/images/ja.png" "Oh! you're back" "Hello!"
}

# Lock (10 min)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Screen off shortly after locking (12 min) and auto-suspend (20 min) were
# disabled in the Hyprland config; kept disabled here for behavioural parity.
