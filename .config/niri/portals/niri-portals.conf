# Source of truth for niri's portal selection.
# Install at /etc/xdg-desktop-portal/niri-portals.conf (root), NOT under ~/.config
# (the niri package already ships an identical default in /usr/share).
# FileChooser=gtk because this desktop uses thunar, not nautilus (xdg-desktop-portal-gnome >=47
# hard-codes nautilus for the file chooser).
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
