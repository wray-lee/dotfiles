# swaync is D-Bus/systemd-activated, so command-line flags elsewhere are lost
# ($$ stops systemd from expanding the variables itself).
# Under niri, start it with niri's config; any other desktop keeps the default.
# Lives in ~/.config, so copying the dotfiles installs it; Hyprland is unaffected.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ "$$XDG_CURRENT_DESKTOP" = niri ]; then exec /usr/bin/swaync -c "$$HOME/.config/niri/swaync/config.json"; else exec /usr/bin/swaync; fi'
